<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator UI</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1976d2;
    background-image: linear-gradient(rgb(110, 63, 203) rgba(48, 108, 197, 0.2));
}

.calculator{
    background:#e5e5e5;
    padding:30px;
    border-radius:20px;
    width:260px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.display{
    width:100%;
    height:50px;
    border-radius:10px;
    border:none;
    background:#d9d9d9;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:50px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

/* operator buttons */
.block{
    background:#f4c86a;
}

/* number buttons */
.number{
    background:#a8c7df;
}

/* clear button */
.clear{
    background:#f35a4a;
    color:white;
}

/* equal button */
.equal{
    background:#20c997;
    grid-column:span 2;
    color:white;
}

</style>
</head>

<body>

<div class="calculator">

<input class="display">

<div class="buttons">

<button class="block">+</button>
<button class="block">-</button>
<button class="block">x</button>
<button class="block">%</button>

<button class="number">6</button>
<button class="number">7</button>
<button class="number">8</button>
<button class="number">9</button>

<button class="number">5</button>
<button class="number">4</button>
<button class="number">3</button>
<button class="number">2</button>

<button class="number">1</button>
<button class="number">0</button>
<button class="number">.</button>
<button class="clear">C</button>

<button class="equal">=</button>

</div>

</div>

</body>
</html>
