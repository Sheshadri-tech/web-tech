<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<h2></h2>

<form action="#" method="post">

<fieldset>
<legend>Personal Details</legend>

<table>

<tr>
    <td><label for="fname">First Name:</label></td>
    <td><input type="text" id="fname" name="fname" maxlength="20" pattern="[A-Za-z]{1,20}" required> max 20 char a-z and A-Z</td> 
    <!-- <td>max 20 char a-z and A-Z</td> -->
</tr>

<tr>
    <td><label for="lname">Last Name:</label></td>
    <td><input type="text" id="lname" name="lname" maxlength="20" pattern="[A-Za-z]{1,20}" required> max 20 char a-z and A-Z</td>
    <!-- <td>max 20 char a-z and A-Z</td> -->
</tr>
<tr>
        <td>Date of Birth</td>

        <!-- Day -->
        <td>
            <select name="day">
                <option value="">Day</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>
            </select>
    
            <select name="month">
                <option value="">Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>
            
            <select name="year">
                <option value="">Year</option>
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
                <option>2021</option>
                <option>2020</option>
                <option>2019</option>
                <option>2018</option>
                <option>2017</option>
                <option>2016</option>
                <option>2015</option>
                <option>2014</option>
                <option>2013</option>
                <option>2012</option>
                <option>2011</option>
                <option>2010</option>
                <option>2000</option>
                <option>1990</option>
            </select>
        </td>

    </tr>

<tr>
    <td><label>Gender:</label></td>
    <td>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
    </td>
</tr>

<tr>
    <td><label for="email">Email:</label></td>
    <td><input type="email" id="email" name="email" required></td>
</tr>

<tr>
    <td><label for="mobile">Mobile Number:</label></td>
    <td><input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required></td>
</tr>

<tr>
    <td><label for="address">Address:</label></td>
    <td><textarea id="address" name="address" rows="3" cols="20"></textarea></td>
</tr>

<tr>
    <td><label for="city">City:</label></td>
    <td><input type="text" id="city" name="city"></td>
</tr>

<tr>
    <td><label for="pin">Pin Code:</label></td>
    <td><input type="text" id="pin" name="pin" pattern="[0-9]{6}"> 6 digit numbers</td>
    <!-- <td>6 digit numbers</td> -->
</tr>

<tr>
    <td><label for="state">State:</label></td>
    <td><input type="text" id="state" name="state"></td>
</tr>

<tr>
    <td><label for="country">Country:</label></td>
    <td><input type="text" id="country" name="country"></td>
</tr>

<tr>
    <td><label>Hobbies:</label></td>
    <td>
        <input type="checkbox" id="reading" name="hobby" value="Reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="traveling" name="hobby" value="Traveling">
        <label for="traveling">Traveling</label>

        <input type="checkbox" id="cooking" name="hobby" value="Cooking">
        <label for="cooking">Cooking</label>

        <input type="checkbox" id="dancing" name="hobby" value="Dancing">
        <label for="dancing">Dancing</label>
        <br>
        <label for="others">others</label>
        <input type="text" id="others" name="hobby" value="">
        <!-- <label for="others">others</label> -->
    </td>
    
</tr>

</table>
</fieldset>

<br>

<fieldset>
<legend>Qualification</legend>

<table border="1">

<tr>
    <th>Sl.No</th>
    <th>Examination</th>
    <th>Board/University</th>
    <th>Percentage</th>
    <th>Year of Passing</th>
</tr>

<tr>
    <td>01</td>
    <td><input type="text" name="exam1"></td>
    <td><input type="text" name="board1"></td>
    <td><input type="text" name="percent1"></td>
    <td><input type="text" name="year1"></td>
</tr>

<tr>
    <td>02</td>
    <td><input type="text" name="exam2"></td>
    <td><input type="text" name="board2"></td>
    <td><input type="text" name="percent2"></td>
    <td><input type="text" name="year2"></td>
</tr>

<tr>
    <td>03</td>
    <td><input type="text" name="exam3"></td>
    <td><input type="text" name="board3"></td>
    <td><input type="text" name="percent3"></td>
    <td><input type="text" name="year3"></td>
</tr>

<tr>
    <td>04</td>
    <td><input type="text" name="exam4"></td>
    <td><input type="text" name="board4"></td>
    <td><input type="text" name="percent4"></td>
    <td><input type="text" name="year4"></td>
</tr>

</table>
</fieldset>

<br>

<fieldset>
<legend>Course Applied For</legend>

<input type="checkbox" id="BE" name="course" value="BE">
<label for="BE">BE</label>

<input type="checkbox" id="BCA" name="course" value="BCA">
<label for="bca">BCA</label>

<input type="checkbox" id="bcom" name="course" value="BCOM">
<label for="bcom">B.COM</label>

<input type="checkbox" id="ba" name="course" value="BA">
<label for="ba">BA</label>

</fieldset>

<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
